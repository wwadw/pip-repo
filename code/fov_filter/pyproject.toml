[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fov-filter"
version = "0.1.11"
description = "ROS PointCloud2 FOV filter with bag playback and dynamic region control"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy",
  "PyYAML",
  "tomli; python_version < '3.11'",
]

[project.scripts]
fov-filter = "fov_filter.cli:main"
fov-filter-ctl = "fov_filter.control:main"
fov-filter-ui = "fov_filter.ui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fov_filter*"]
